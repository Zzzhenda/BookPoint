# Aplicacion BookPoint Chile
spring.application.name=bookpoint
server.port=8080

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:bookpointdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datos iniciales: data.sql se carga al arrancar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Comunicacion entre microservicios (WebClient).
# En despliegues separados se cambia esta URL por la del microservicio de pedidos.
bookpoint.api.base-url=http://localhost:8080
