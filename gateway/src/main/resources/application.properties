# ===========================================================
#  BookPoint Chile - API Gateway
#  Punto de entrada unico (puerto 8080). Enruta cada ruta /api/...
#  al microservicio correspondiente. NO lleva logica de negocio.
#
#  Patron de cada ruta (Spring Cloud Gateway sobre Spring Boot 4):
#    ...server.webflux.routes[n].id          -> nombre de la ruta
#    ...server.webflux.routes[n].uri         -> a que microservicio reenvia
#    ...server.webflux.routes[n].predicates  -> que rutas captura (Path)
# ===========================================================

server.port=8090
spring.application.name=gateway

# --- ms-clientes (8081) ---
spring.cloud.gateway.server.webflux.routes[0].id=ms-clientes
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**

# --- ms-productos (8082) ---
