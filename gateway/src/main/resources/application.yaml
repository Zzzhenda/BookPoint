# ===========================================================
#  BookPoint Chile - API Gateway
#  Punto de entrada unico (puerto 8090). Enruta cada ruta /api/...
#  al microservicio correspondiente. NO lleva logica de negocio.
#
#  Patron de cada ruta (Spring Cloud Gateway sobre Spring Boot 4):
#    spring.cloud.gateway.server.webflux.routes[n].id          -> nombre de la ruta
#    spring.cloud.gateway.server.webflux.routes[n].uri         -> a que microservicio reenvia
#    spring.cloud.gateway.server.webflux.routes[n].predicates  -> que rutas captura (Path)
# ===========================================================

server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # --- ms-clientes (8081) ---
            - id: ms-clientes
              uri: http://localhost:8081
              predicates:
                - Path=/api/clientes/**

            # --- ms-productos (8082) ---
            - id: ms-productos
              uri: http://localhost:8082
              predicates:
                - Path=/api/productos/**

            # --- ms-inventario (8083) ---
            - id: ms-inventario
              uri: http://localhost:8083
              predicates:
                - Path=/api/inventario/**

            # --- ms-carrito (8084) ---
            - id: ms-carrito
              uri: http://localhost:8084
              predicates:
                - Path=/api/carritos/**

            # --- ms-pedidos (8085) ---
            - id: ms-pedidos
              uri: http://localhost:8085
              predicates:
                - Path=/api/pedidos/**

            # --- ms-ventas (8086) ---
            - id: ms-ventas
              uri: http://localhost:8086
              predicates:
                - Path=/api/ventas/**

            # --- ms-despachos (8087) ---
            - id: ms-despachos
              uri: http://localhost:8087
              predicates:
                - Path=/api/despachos/**

            # --- ms-sucursales (8088) ---
            - id: ms-sucursales
              uri: http://localhost:8088
              predicates:
                - Path=/api/sucursales/**

# Log del gateway 
logging:
  level:
    "org.springframework.cloud.gateway": INFO
