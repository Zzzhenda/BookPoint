# ===========================================================
#  BookPoint Chile - ms-carrito
#  Carrito de compra. Al agregar un producto, consulta a
#  ms-productos (puerto 8082) por WebClient para validar el
#  producto y obtener su titulo y precio.
#  La base "carrito_db" se crea sola al arrancar (XAMPP/MySQL encendido).
# ===========================================================

server.port=8084
spring.application.name=ms-carrito

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/carrito_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- URL del microservicio de productos (lo consume el WebClient) ---
productos.url=http://localhost:8082
