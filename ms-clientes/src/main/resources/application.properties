# ===========================================================
#  BookPoint Chile - ms-clientes
#  Microservicio que gestiona el registro, perfil y direcciones
#  de los clientes. Lo consultara ms-pedidos para validar que el
#  cliente existe antes de generar un pedido.
#  La base "clientes_db" se crea sola al arrancar (XAMPP/MySQL encendido).
# ===========================================================

server.port=8081
spring.application.name=ms-clientes

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/clientes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
