# ===========================================================
#  BookPoint Chile - ms-inventario
#  Controla el stock de cada producto en cada sucursal y el
#  stock minimo para alertar reposicion.
#  La base "inventario_db" se crea sola al arrancar (XAMPP/MySQL encendido).
# ===========================================================

server.port=8083
spring.application.name=ms-inventario

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
