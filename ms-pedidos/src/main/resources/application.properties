# ===========================================================
#  BookPoint Chile - ms-pedidos
#  Genera un pedido a partir de un carrito. Consulta a
#  ms-clientes (8081) para validar el cliente y a ms-carrito
#  (8084) para traer los productos del carrito.
#  La base "pedidos_db" se crea sola al arrancar (XAMPP/MySQL encendido).
# ===========================================================

server.port=8085
spring.application.name=ms-pedidos

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/pedidos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- URLs de los microservicios que consume el WebClient ---
clientes.url=http://localhost:8081
carrito.url=http://localhost:8084
