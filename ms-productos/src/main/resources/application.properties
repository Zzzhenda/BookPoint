# ===========================================================
#  BookPoint Chile - ms-productos
#  Catalogo de libros y utiles. ms-carrito consultara el
#  GET /api/productos/{id} para validar el producto y su precio.
#  La base "productos_db" se crea sola al arrancar (XAMPP/MySQL encendido).
# ===========================================================

server.port=8082
spring.application.name=ms-productos

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/productos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
