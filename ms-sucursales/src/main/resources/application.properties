# ===========================================================
#  BookPoint Chile - ms-sucursales
#  Microservicio que administra los datos de las sucursales
#  (Concepcion, Temuco y La Serena).
#  La base "sucursales_db" se crea sola al arrancar
#  (createDatabaseIfNotExist). Solo hay que tener MySQL (XAMPP) encendido.
# ===========================================================

server.port=8088
spring.application.name=ms-sucursales

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/sucursales_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: Hibernate crea/actualiza las tablas solo a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
