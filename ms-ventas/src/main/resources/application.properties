# ===========================================================
#  BookPoint Chile - ms-ventas
#  Registra la venta/boleta de un pedido. Consulta a ms-pedidos
#  (8085) para validar el pedido y obtener su total.
#  La base "ventas_db" se crea sola al arrancar (XAMPP/MySQL encendido).
# ===========================================================

server.port=8086
spring.application.name=ms-ventas

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/ventas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- URL del microservicio de pedidos (lo consume el WebClient) ---
pedidos.url=http://localhost:8085
